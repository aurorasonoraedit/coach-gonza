# Publica la app en GitHub Pages y renueva las noticias de box cada 3 horas.
name: Publicar Coach Gonza

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: coach-gonza
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: coach-gonza/package-lock.json
      - run: npm ci
      - name: Buscar noticias de boxeo
        run: node scripts/fetch-news.mjs
        continue-on-error: true
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: coach-gonza/dist
      - id: deployment
        uses: actions/deploy-pages@v4
